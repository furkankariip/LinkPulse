<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkPulse</title>
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --text: #151823; --muted: #667085;
      --border: #e4e7ec; --accent: #5b5bd6; --accent-text: #ffffff; --bar: #c7c7f5; --error: #d92d20;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117; --card: #171a23; --text: #e8eaf0; --muted: #98a2b3;
        --border: #262a36; --accent: #8b8bf5; --accent-text: #0f1117; --bar: #3d3d7a; --error: #f97066;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .lead { margin: 4px 0 28px; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    form { display: grid; grid-template-columns: 1fr 160px auto; gap: 10px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
    button.ghost { background: transparent; color: var(--accent); padding: 4px 8px; }
    .error { color: var(--error); margin: 10px 0 0; min-height: 1.5em; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 13px; }
    td.target { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    tr.row { cursor: pointer; }
    tr.row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
    a { color: var(--accent); }
    .chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin: 16px 0 6px; }
    .chart div { flex: 1; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
    .chart div span { position: absolute; top: -20px; width: 100%; text-align: center; font-size: 12px; color: var(--muted); }
    .days { display: flex; gap: 8px; font-size: 12px; color: var(--muted); }
    .days span { flex: 1; text-align: center; }
    .meta { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 16px; font-size: 14px; }
    .meta b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
    footer { color: var(--muted); font-size: 13px; }
    @media (max-width: 600px) { form { grid-template-columns: 1fr; } td.target { display: none; } }
  </style>
</head>
<body>
<main>
  <h1>Link<span>Pulse</span></h1>
  <p class="lead">Shorten a URL and watch the clicks come in.</p>

  <section class="card">
    <form id="create">
      <input id="url" type="url" placeholder="https://your-long-url.com/..." required>
      <input id="alias" placeholder="custom-alias (optional)">
      <button type="submit">Shorten</button>
    </form>
    <p class="error" id="error"></p>
  </section>

  <section class="card" id="stats" hidden></section>

  <section class="card">
    <table>
      <thead><tr><th>Short link</th><th>Target</th><th>Clicks</th><th></th></tr></thead>
      <tbody id="links"></tbody>
    </table>
  </section>

  <footer>REST API docs: <a href="/scalar">/scalar</a> · <a href="/openapi/v1.json">OpenAPI</a> · <a href="/health">health</a></footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const escape = (text) => String(text).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

  async function loadLinks() {
    const response = await fetch("/api/links?pageSize=20");
    const { items } = await response.json();
    $("links").innerHTML = items.map((link) => `
      <tr class="row" data-code="${escape(link.code)}">
        <td><a href="${escape(link.shortUrl)}" target="_blank" rel="noopener">/${escape(link.code)}</a></td>
        <td class="target" title="${escape(link.targetUrl)}">${escape(link.targetUrl)}</td>
        <td>${link.totalClicks}</td>
        <td><button class="ghost" data-copy="${escape(link.shortUrl)}">Copy</button></td>
      </tr>`).join("") || `<tr><td colspan="4">No links yet.</td></tr>`;
  }

  async function showStats(code) {
    const stats = await (await fetch(`/api/links/${encodeURIComponent(code)}/stats`)).json();
    const max = Math.max(1, ...stats.last7Days.map((d) => d.clicks));
    const referrers = stats.topReferrers.map((r) => `${escape(r.referrer)} (${r.clicks})`).join(", ") || "-";
    const devices = Object.entries(stats.devices).map(([d, n]) => `${escape(d)} ${n}`).join(", ") || "-";
    $("stats").hidden = false;
    $("stats").innerHTML = `
      <strong>/${escape(stats.code)}</strong> · last 7 days
      <div class="chart">${stats.last7Days.map((d) =>
        `<div style="height:${(d.clicks / max) * 100}%"><span>${d.clicks}</span></div>`).join("")}</div>
      <div class="days">${stats.last7Days.map((d) =>
        `<span>${new Date(d.date).toLocaleDateString(undefined, { weekday: "short" })}</span>`).join("")}</div>
      <div class="meta">
        <div><b>Total clicks</b>${stats.totalClicks}</div>
        <div><b>Top referrers</b>${referrers}</div>
        <div><b>Devices</b>${devices}</div>
      </div>`;
  }

  $("create").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("error").textContent = "";
    const response = await fetch("/api/links", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("url").value, alias: $("alias").value || null })
    });
    if (!response.ok) {
      const problem = await response.json().catch(() => ({}));
      $("error").textContent = problem.errors ? Object.values(problem.errors).flat().join(" ") : problem.title ?? "Something went wrong.";
      return;
    }
    const link = await response.json();
    event.target.reset();
    await loadLinks();
    await navigator.clipboard?.writeText(link.shortUrl).catch(() => {});
  });

  $("links").addEventListener("click", async (event) => {
    const copy = event.target.closest("[data-copy]");
    if (copy) {
      await navigator.clipboard?.writeText(copy.dataset.copy);
      copy.textContent = "Copied";
      return;
    }
    const row = event.target.closest("tr.row");
    if (row && !event.target.closest("a")) location.hash = row.dataset.code;
  });

  window.addEventListener("hashchange", () => showStats(location.hash.slice(1)));
  loadLinks();
  if (location.hash) showStats(location.hash.slice(1));
</script>
</body>
</html>
