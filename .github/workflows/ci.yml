name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t linkpulse:ci .

      - name: Smoke test
        run: |
          docker run -d --name linkpulse -p 8080:8080 linkpulse:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/health && exit 0; sleep 1; done
          docker logs linkpulse
          exit 1
